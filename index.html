<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#007AC9" />
    <meta name="description" content="Live HSL vehicle positions around you" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://mqtt.hsl.fi" crossorigin />
    <title>HSL Live</title>
  </head>
  <body>
    <div id="map"></div>

    <div id="top">
      <form id="search" role="search" autocomplete="off">
        <span id="status" class="dot connecting" title="Connecting…"></span>
        <input
          id="q"
          type="text"
          inputmode="text"
          enterkeyhint="search"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="Line 551 or vehicle #1234"
          aria-label="Search lines (551) or vehicle numbers (#1234)"
        />
        <button type="button" id="clear" class="ib" hidden aria-label="Clear search">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </form>
      <div id="modes" role="group" aria-label="Show or hide vehicle types">
        <span class="lbl">Show</span>
        <button type="button" data-mode="bus" aria-pressed="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12l5 5 9-10" /></svg>Bus</button>
        <button type="button" data-mode="tram" aria-pressed="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12l5 5 9-10" /></svg>Tram</button>
        <button type="button" data-mode="metro" aria-pressed="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12l5 5 9-10" /></svg>Metro</button>
        <button type="button" data-mode="train" aria-pressed="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12l5 5 9-10" /></svg>Train</button>
        <button type="button" data-mode="ferry" aria-pressed="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12l5 5 9-10" /></svg>Ferry</button>
      </div>
      <div id="hint" hidden></div>
    </div>

    <div id="bottom">
      <button type="button" id="locate" aria-label="Show my location">
        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="4" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /><circle cx="12" cy="12" r="8" /></svg>
      </button>
      <section id="card" hidden aria-live="polite"></section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
